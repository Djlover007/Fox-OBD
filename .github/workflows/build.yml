name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk FoxOBD.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fox OBD (Build ${{ github.run_number }})
          body: |
            Automatischer Build von ${{ github.sha }}.
            Installation: FoxOBD.apk aufs Handy laden und öffnen („Unbekannte Apps installieren“ erlauben).
          files: FoxOBD.apk
          make_latest: true
